# Smoke pipeline — verifies that the 1ES.Agency template works end-to-end
# in this repo (right pool, agentContextRoot resolves, preAgentSteps run,
# the stub agent dispatches, postAgentSteps run, artifact gets published).
#
# Run this BEFORE registering wiki-sap-mapping-pipeline.yml. If this smoke
# run fails the real pipeline will too — fix the pool / org / template-pin
# first.
#
# How to use:
#   1. Register this YAML as a pipeline in ADO (Pipelines → New → Existing
#      YAML → .pipelines/smoke-pipeline.yml).
#   2. Click "Run pipeline" and pick the default branch. Don't set Agency
#      preferences — we want a manual run, not an Agency-triggered one.
#   3. Expected pass conditions:
#       • Job log shows: "✅ smoke.txt written" (preAgent) and
#         "✅ smoke.txt verified" (postAgent).
#       • Build summary shows a Published Artifact named `AgencyArtifact`
#         (Agency template hardcodes that name — see logPath comment below)
#         containing smoke.txt + build-info.json + Agency's own log files.
#       • The artifact is downloadable from the build page.
#   4. If it passes, delete this pipeline (and the two files
#      .pipelines/smoke-pipeline.yml + .github/agents/smoke.agent.md)
#      in a tiny follow-up PR. They are smoke-only.
trigger: none
pr: none

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Agency.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: MSSecurity-1ES-Build-Agents-Pool
      image: MSSecurity-1ES-Windows-2022
      os: windows

    agentContextRoot: $(Build.SourcesDirectory)

    # IMPORTANT: do NOT set logPath to a subdir of $(Build.SourcesDirectory).
    # Agency creates $(Agency_LogPath) before its own clone step runs, and
    # `git clone . ` requires an empty target — so a $(Build.SourcesDirectory)/...
    # logPath populates the clone target prematurely and the clone fails with
    # "destination path '.' already exists and is not an empty directory".
    # Leave logPath default ($(Build.StagingDirectory)/agency-logs); we copy
    # our files into $(Agency_LogPath) in postAgentSteps so they land in
    # AgencyArtifact.

    preAgentSteps:
      - task: PowerShell@2
        displayName: 'Smoke: write a tiny file under out/'
        inputs:
          targetType: inline
          pwsh: true
          workingDirectory: $(Build.SourcesDirectory)
          script: |
            New-Item -ItemType Directory -Force -Path out | Out-Null
            @"
            Smoke test from 1ES.Agency.PipelineTemplate
            Build:        $(Build.BuildNumber)
            Branch:       $(Build.SourceBranchName)
            Definition:   $(System.DefinitionName) ($(System.DefinitionId))
            Pool image:   MSSecurity-1ES-Windows-2022
            Generated at: $(Get-Date -Format o)
            "@ | Set-Content out/smoke.txt

            # Also drop a tiny structured file so we can prove JSON survives.
            @{
              build       = "$(Build.BuildNumber)"
              definitionId = "$(System.DefinitionId)"
              sourceBranch = "$(Build.SourceBranchName)"
              writtenAt    = (Get-Date -Format o)
            } | ConvertTo-Json | Set-Content out/build-info.json

            Write-Host "✅ smoke.txt written"
            Get-ChildItem out -File | Format-Table Name,Length

    postAgentSteps:
      - task: PowerShell@2
        displayName: 'Smoke: verify file survived agent step'
        inputs:
          targetType: inline
          pwsh: true
          workingDirectory: $(Build.SourcesDirectory)
          script: |
            if (-not (Test-Path out/smoke.txt))      { throw "out/smoke.txt missing after agent step" }
            if (-not (Test-Path out/build-info.json)) { throw "out/build-info.json missing after agent step" }
            $sz = (Get-Item out/smoke.txt).Length
            if ($sz -le 0) { throw "out/smoke.txt is empty ($sz bytes)" }
            Write-Host "✅ smoke.txt verified ($sz bytes)"
            Get-Content out/smoke.txt
            Write-Host "---"
            Get-Content out/build-info.json

      # Copy our out/ contents into Agency's log dir so they end up
      # inside AgencyArtifact (which is the only artifact Agency lets
      # us publish — outputs: parameter is filtered, PublishPipelineArtifact@1
      # is SDL-blocked).
      - task: PowerShell@2
        displayName: 'Smoke: copy out/ into $(Agency_LogPath) for artifact'
        inputs:
          targetType: inline
          pwsh: true
          workingDirectory: $(Build.SourcesDirectory)
          script: |
            $dst = $env:Agency_LogPath
            if (-not $dst) { throw "Agency_LogPath env var not set" }
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item -Recurse -Force out\* $dst\
            Write-Host "Copied to $dst :"
            Get-ChildItem $dst -File | Format-Table Name,Length

      # Agency template doesn't accept a top-level `outputs:` parameter,
      # and SDL blocks PublishPipelineArtifact@1. Agency publishes
      # $(Agency_LogPath) automatically as AgencyArtifact.
